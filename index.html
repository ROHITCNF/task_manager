<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMT</title>
    <script>
      // Pre-paint theme (docs/lld/components.md §4). Must mirror src/app/theme.js.
      (function () {
        var pref = 'light';
        try { pref = localStorage.getItem('dmt.theme') || 'light'; } catch (e) {}
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
